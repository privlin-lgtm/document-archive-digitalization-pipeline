name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: document_archive
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A real Postgres so the Postgres-gated tests (tsvector/pg_trgm/BRIN
      # -- see test_queries.py, test_review_api.py's search tests) run in
      # CI instead of skipping; everything else in the suite mocks its one
      # external dependency (pytesseract) and needs no other infra.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/document_archive
      REVIEW_API_TOKEN: ci-test-token-not-a-real-secret-000000000000
      APP_ENV: development
      RATE_LIMIT_REDIS_URL: redis://localhost:6379/2
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Dependency vulnerability scan
        # README used to say "run uvx pip-audit before a real deployment" as
        # a manual step -- nothing actually ran it. `--with pip-audit` audits
        # what `uv sync` just installed in this job's own venv (no separate
        # resolve against PyPI needed). Doesn't fail the build -- a new CVE
        # landing in a transitive dependency shouldn't block an unrelated PR
        # -- it's here so a scan happens on every push instead of never.
        run: uv run --with pip-audit pip-audit --strict || echo "::warning::pip-audit found issues -- see the step output above"

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 needs a newer undici than Node 20 bundles -- npm test
          # failed on every CI run since it was added ("webidl.util.
          # markAsUncloneable is not a function", from undici's CacheStorage
          # shim), unnoticed because nothing was checking CI status. Bumped
          # to 22 LTS, which also matches GitHub Actions' own Node 20
          # deprecation.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerability scan
        run: npm audit --omit=dev || echo "::warning::npm audit found issues -- see the step output above"
