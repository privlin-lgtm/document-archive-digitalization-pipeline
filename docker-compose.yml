services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-document_archive}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    # DATABASE_URL/CELERY_*/RATE_LIMIT_REDIS_URL are deliberately hardcoded,
    # not `${VAR:-default}` -- .env is also used for host-side `uv run` dev
    # (see README's "Local development"), which legitimately needs
    # different values for these same names (e.g. localhost:5432, not
    # db:5432). `${DATABASE_URL:-...}` would let a host-oriented .env value
    # silently leak into the container via Compose's own variable
    # interpolation (separate from env_file, which these `environment:`
    # entries already take precedence over for the same key) -- reproduced
    # live: the app tried to reach 127.0.0.1:5432 instead of db:5432.
    # These four must always be the in-network service address inside this
    # container, full stop, so there is nothing to make overridable here.
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/document_archive
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      RATE_LIMIT_REDIS_URL: redis://redis:6379/2
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-["any"]}
    # 8000 is for local Vite (`npm run dev` proxies here). Production should
    # publish only the gateway (8080/443) and leave this unpublished.
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - document_data:/data/documents
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    # See app's environment: block above for why these are hardcoded.
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/document_archive
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: ["celery", "-A", "worker.celery_app", "worker", "--beat", "--concurrency=2", "--loglevel=INFO"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - document_data:/data/documents
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery_app inspect ping --timeout 5 | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4g

  web:
    build: ./web
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - app

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_healthy
      web:
        condition: service_started

  backup:
    image: postgres:15
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-document_archive}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - document_data:/data/documents:ro
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/backup.sh"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

volumes:
  db_data:
  document_data:
