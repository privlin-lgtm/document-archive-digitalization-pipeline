[project]
name = "document-archive-pipeline"
version = "0.1.0"
description = "Ingests scanned historical documents, runs OCR/entity extraction, and surfaces results for human review."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "celery>=5.4",
    "redis>=5.1",
    "python-multipart>=0.0.12",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "pytesseract>=0.3.13",
    "spacy>=3.8.16",
    "rapidfuzz>=3.14.6",
    # spaCy's small English pipeline — not on PyPI, installed from its wheel
    # release. Default NER backend: fast, no torch dependency. Swap in the
    # `ner-transformer` extra below for higher accuracy at a much heavier
    # install cost.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]
# Heavy transformer-based handwriting backend. Not installed by default:
# torch + model weights are large downloads. Install with `uv sync --extra handwriting`.
handwriting = [
    "transformers>=4.44",
    "torch>=2.4",
]
# Higher-accuracy transformer NER pipeline for extraction/entities.py
# (spec's suggested en_core_web_trf). Heavy: torch + spacy-transformers +
# a ~500MB model. Install with `uv sync --extra ner-transformer`, then set
# NER_MODEL=en_core_web_trf.
ner-transformer = [
    "spacy-transformers>=1.3",
    "en-core-web-trf @ https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "ocr", "extraction", "storage", "review_api", "pipeline"]

[tool.hatch.metadata]
# Required for the en-core-web-sm/en-core-web-trf direct-URL dependencies
# above — spaCy models aren't published to PyPI.
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
# Checked against 3.12 typeshed, one above requires-python's 3.11 floor:
# the installed numpy's bundled .pyi stubs use PEP 695 `type` statement
# syntax, which mypy rejects outright under a 3.11 target ("errors
# prevented further checking" before any of this project's own code was
# even reached). This only affects which typeshed/stub syntax mypy accepts,
# not what CI actually runs the tests on (still 3.11, per that workflow).
python_version = "3.12"
# Permissive baseline, not strict mode: this codebase has type hints
# throughout but has never been checked, so starting strict would surface
# an unbounded backlog on day one instead of catching new regressions.
# check_untyped_defs still type-checks the body of every function (even
# ones without full annotations), which is where a real mismatch actually
# gets caught -- ignore_missing_imports just means an unstubbed third-party
# import (cv2, pytesseract, ...) doesn't block the whole run.
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["^alembic/versions/"]
# Understands BaseModel/BaseSettings' dynamically-generated __init__ from
# field declarations -- without it, config.Settings() looks like a call
# missing every required argument to mypy, since it can't see that
# pydantic-settings populates them from the environment at runtime.
plugins = ["pydantic.mypy"]
# Production code only (invoke as plain `mypy`, no path argument -- a path
# argument on the command line overrides this list entirely). tests/ isn't
# a package (no __init__.py by design), so a module-name override can't
# glob "every test_*.py file" the way `tests.*` would for a real package;
# excluding the directory here is the straightforward alternative. Tests
# lean on patterns that legitimately defeat static typing rather than
# indicate real bugs: constructing Settings/dataclasses via **kwargs dicts
# built for readability, not type-accuracy; pydantic-settings' private
# _env_file kwarg (real at runtime, absent from the plugin-generated
# __init__); module-level "Redis | None, narrowed by a skipif" fixtures.
# Production code is what needs the static safety net.
files = [
    "config.py",
    "worker.py",
    "review_api",
    "ocr",
    "extraction",
    "storage",
    "pipeline",
    "ingestion",
    "scripts",
]

[tool.ruff.lint]
# B008 (function-call-in-default-argument) is a false positive for FastAPI's
# own idiom -- Depends(...)/Query(...) *must* be called in the signature,
# that's how FastAPI's dependency injection recognizes them. Left enabled,
# it was 19 of `ruff check .`'s 29 findings, burying the ones that are real.
ignore = ["B008"]
